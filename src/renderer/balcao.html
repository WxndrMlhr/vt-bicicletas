<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Balcão — VT Bicicletas</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="tela-pedido.js"></script>
  <style>
    /* Tela de atendimento: campos maiores, menos coisa na frente,
       pensada para vender rápido com o cliente esperando. */
    .busca-grande input {
      font-size: 1.15rem;
      padding: 0.85rem 0.9rem;
    }
    .busca-grande .sugestao {
      padding: 0.6rem 0.75rem;
      font-size: 0.95rem;
    }

    #tabela-venda td { padding: 0.6rem; font-size: 0.95rem; }
    #tabela-venda input.qtd {
      width: 74px;
      padding: 0.4rem 0.45rem;
      font-size: 1rem;
    }

    .fecho {
      background: var(--aco-900);
      color: var(--branco);
      border-radius: var(--raio);
      padding: 1.2rem 1.4rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .fecho .rotulo {
      font-family: var(--face-titulo);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: var(--aco-300);
    }
    .fecho .valor {
      font-family: var(--face-numero);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meio-pagamento { display: flex; gap: 0.5rem; }
    .meio-pagamento button {
      flex: 1;
      padding: 0.7rem;
      font-size: 0.95rem;
      background: var(--branco);
      border: 1px solid var(--aco-100);
      color: var(--aco-700);
    }
    .meio-pagamento button.escolhido {
      background: var(--aco-900);
      color: var(--branco);
      border-color: var(--aco-900);
    }

    .botao-finalizar { width: 100%; padding: 0.95rem; font-size: 1.05rem; }

    .aviso {
      display: none;
      background: #FFF4EC;
      border: 1px solid #F6C9A6;
      border-left: 3px solid var(--oxido);
      border-radius: var(--raio);
      padding: 0.7rem 0.85rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .aviso .titulo { font-weight: 700; color: var(--oxido); margin-bottom: 0.25rem; }
    .aviso ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }

    .atalho-dica {
      font-size: 0.78rem;
      color: var(--aco-500);
      margin-top: 0.4rem;
    }

    /* ---------- A caixinha de venda realizada ---------- */
    .cobertura-venda {
      position: fixed; inset: 0; background: rgba(22,25,31,0.45);
      z-index: 60; display: none;
    }
    .cobertura-venda.aberta { display: block; }

    .caixa-venda {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--branco); border-radius: var(--raio);
      box-shadow: 0 24px 60px rgba(22,25,31,0.3);
      padding: 1.7rem 1.9rem 1.6rem; width: min(420px, 92vw);
      z-index: 61; display: none; text-align: center;
    }
    .caixa-venda.aberta { display: block; }

    .caixa-venda .certo {
      width: 46px; height: 46px; margin: 0 auto 0.7rem;
      border-radius: 50%; background: #EDF6F1; color: var(--verde);
      font-size: 26px; line-height: 46px; font-weight: 700;
    }
    .caixa-venda h2 {
      font-family: var(--face-titulo); font-size: 1.35rem; margin: 0;
    }
    .caixa-venda .numero-venda {
      font-family: var(--face-numero); color: var(--aco-500);
      font-size: 0.87rem; margin-top: 0.15rem;
    }

    .resumo-venda {
      margin-top: 1.2rem; text-align: left;
      border-top: 1px solid var(--aco-100); padding-top: 0.9rem;
    }
    .resumo-venda > div {
      display: flex; justify-content: space-between; gap: 1rem;
      font-size: 0.9rem; padding: 0.22rem 0;
    }
    .resumo-venda .r { color: var(--aco-500); }
    .resumo-venda .v { font-family: var(--face-numero); text-align: right; }
    .resumo-venda .destaque {
      font-size: 1.15rem; font-weight: 700; padding-top: 0.5rem;
      margin-top: 0.35rem; border-top: 1px solid var(--aco-100);
    }

    /* O recado fica DENTRO da caixinha de propósito: se o cupom não sair,
       a notícia tem de aparecer junto do botão que tenta de novo, e não
       num alerta do Windows saltando por cima. */
    .caixa-venda .recado {
      display: none; margin-top: 0.9rem; text-align: left;
      border-radius: var(--raio); padding: 0.6rem 0.7rem;
      font-size: 0.83rem; border: 1px solid; border-left-width: 3px;
    }
    .caixa-venda .recado.erro    { background: #FBEFE9; border-color: #E8BBA6; color: var(--oxido); }
    .caixa-venda .recado.atencao { background: #FCF6E4; border-color: #E8D08C; color: var(--ambar-alto); }
    .caixa-venda .recado.certo   { background: #EDF6F1; border-color: #B7D9C7; color: var(--verde); }

    .caixa-venda .segunda-via {
      width: 100%; margin-top: 0.5rem;
      background: transparent; border-color: var(--aco-100); color: var(--aco-500);
    }
    .caixa-venda .segunda-via:hover { background: var(--papel); color: var(--aco-700); }
    .caixa-venda .dica {
      font-size: 0.78rem; color: var(--aco-500);
      margin-top: 0.7rem; text-align: center;
    }
  </style>
</head>
<body>
  <script src="menu.js"></script>

  <main class="conteudo">
    <h1 class="titulo-pagina">Balcão</h1>
    <p class="subtitulo-pagina">Venda de varejo, preço de balcão. Sem prazo, sem regra de R$ 2.000.</p>

    <div class="cartao busca-grande">
      <div class="campo-busca">
        <label class="campo" for="busca">Peça</label>
        <input type="text" id="busca" placeholder="Digite o nome da peça e aperte Enter" autocomplete="off">
        <div class="sugestoes" id="sugestoes"></div>
      </div>
      <div class="atalho-dica">
        Enter adiciona a primeira peça da lista. Setas ↑ ↓ escolhem outra.
      </div>
    </div>

    <div class="aviso" id="aviso-balcao"></div>
    <div class="aviso" id="aviso-estoque"></div>

    <div class="grade-larga">
      <div class="cartao">
        <table id="tabela-venda">
          <thead>
            <tr>
              <th>Peça</th>
              <th class="num" style="width: 100px;">Qtd</th>
              <th class="num" style="width: 110px;">Unitário</th>
              <th class="num" style="width: 120px;">Subtotal</th>
              <th style="width: 1%;"></th>
            </tr>
          </thead>
          <tbody id="itens"></tbody>
        </table>
      </div>

      <div>
        <div class="fecho" style="margin-bottom: 1.1rem;">
          <span class="rotulo">Total</span>
          <span class="valor" id="total">R$ 0,00</span>
        </div>

        <div class="cartao">
          <h2 class="secao">Como pagou</h2>
          <div class="meio-pagamento" style="margin-bottom: 1rem;">
            <button class="escolhido" data-meio="dinheiro">Dinheiro / Pix</button>
            <button data-meio="cartao">Cartão</button>
          </div>

          <!-- O QR aparece aqui, com o total da venda dentro, enquanto o
               cliente decide. É antes de finalizar de propósito: é agora que
               ele aponta a câmera e paga. -->
          <div id="bloco-pix-venda" style="margin-bottom: 1rem;"></div>

          <label class="campo" for="cliente">Cliente (opcional)</label>
          <input type="text" id="cliente" placeholder="Só se quiser registrar" style="margin-bottom: 1rem;">

          <!-- Um botão só. Antes eram três, e a escolha do papel vinha
               ANTES de a venda existir: quem clicava em "Finalizar e
               imprimir" via o diálogo do Windows pular na tela sem aviso,
               no meio do atendimento. Agora a venda é registrada primeiro e
               o papel se decide depois, na caixinha, olhando o cliente.
               Cupom, PDF e sem papel continuam todos lá. -->
          <button class="botao-finalizar" id="btn-finalizar">Finalizar venda</button>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.6rem;">
            <button class="neutro" id="btn-limpar" style="flex: 1;">Limpar</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Depois da venda. -->
  <div class="cobertura-venda" id="cobertura-venda"></div>
  <div class="caixa-venda" id="caixa-venda" role="dialog" aria-modal="true"
       aria-labelledby="venda-titulo">
    <div class="certo">✓</div>
    <h2 id="venda-titulo">Venda realizada</h2>
    <div class="numero-venda" id="venda-numero"></div>

    <div class="resumo-venda" id="venda-resumo"></div>
    <div class="recado" id="venda-recado"></div>

    <div class="acoes" style="margin-top:1.4rem;">
      <button class="neutro" id="btn-fechar-venda">Fechar</button>
      <button id="btn-imprimir-venda">Imprimir cupom</button>
    </div>
    <button class="neutro mini segunda-via" id="btn-pdf-venda">Baixar em PDF</button>
    <div class="dica">Enter imprime · Esc fecha</div>
  </div>

  <script>
    let itens = [];
    let ultimoCalculo = null;
    let meioPagamento = 'dinheiro';
    let cacheProdutos = null;
    let indiceSugestao = -1;
    let sequenciaCalculo = 0;    // descarta resposta de cálculo que chegou fora de ordem
    let restaurando = false;     // enquanto repõe o rascunho, não grava por cima dele

    const rascunho = TelaPedido.criarRascunho('balcao');

    const buscaEl = document.getElementById('busca');
    const sugEl = document.getElementById('sugestoes');
    const itensEl = document.getElementById('itens');
    const totalEl = document.getElementById('total');
    const avisoBalcaoEl = document.getElementById('aviso-balcao');
    const avisoEstoqueEl = document.getElementById('aviso-estoque');

    const real = v => (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const escapar = t => String(t ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

    // ---------- Busca ----------
    async function procurar(termo) {
      const achados = await window.erpAPI.produtos.buscar(termo);
      if (achados && achados.length > 0) return achados;
      if (!cacheProdutos) cacheProdutos = await window.erpAPI.produtos.listar();
      const alvo = termo.toLowerCase();
      return cacheProdutos.filter(p => p.nome.toLowerCase().includes(alvo));
    }

    function marcarSugestao(i) {
      const opcoes = sugEl.querySelectorAll('.sugestao[data-id]');
      if (opcoes.length === 0) return;
      indiceSugestao = Math.max(0, Math.min(i, opcoes.length - 1));
      opcoes.forEach((o, n) => {
        o.style.background = n === indiceSugestao ? '#F0F3F6' : '';
      });
      opcoes[indiceSugestao].scrollIntoView({ block: 'nearest' });
    }

    let t;
    buscaEl.addEventListener('input', (e) => {
      clearTimeout(t);
      const termo = e.target.value.trim();
      if (!termo) { sugEl.style.display = 'none'; indiceSugestao = -1; return; }
      t = setTimeout(async () => {
        const achados = await procurar(termo);
        sugEl.innerHTML = achados.length
          ? achados.slice(0, 25).map(p => `
              <div class="sugestao" data-id="${p.id}" data-nome="${escapar(p.nome)}">
                ${escapar(p.nome)}
                <span class="apoio"> ${p.preco_balcao != null ? real(p.preco_balcao) : real(p.preco_vista) + ' (sem balcão)'}</span>
              </div>`).join('')
          : '<div class="sugestao" style="color:var(--aco-500)">Nenhuma peça com esse nome.</div>';
        sugEl.style.display = 'block';
        marcarSugestao(0);
      }, 160);
    });

    buscaEl.addEventListener('keydown', (e) => {
      const opcoes = sugEl.querySelectorAll('.sugestao[data-id]');
      if (e.key === 'ArrowDown') { e.preventDefault(); marcarSugestao(indiceSugestao + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); marcarSugestao(indiceSugestao - 1); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const escolhida = opcoes[indiceSugestao];
        if (escolhida) {
          adicionar(Number(escolhida.dataset.id), escolhida.dataset.nome);
          buscaEl.value = '';
          sugEl.style.display = 'none';
          indiceSugestao = -1;
        }
      } else if (e.key === 'Escape') {
        sugEl.style.display = 'none';
      }
    });

    sugEl.addEventListener('click', (e) => {
      const opcao = e.target.closest('.sugestao[data-id]');
      if (!opcao) return;
      adicionar(Number(opcao.dataset.id), opcao.dataset.nome);
      buscaEl.value = '';
      sugEl.style.display = 'none';
      buscaEl.focus();
    });

    document.addEventListener('click', (e) => {
      if (e.target !== buscaEl && !sugEl.contains(e.target)) sugEl.style.display = 'none';
    });

    // ---------- Itens ----------
    function celulaNome(l) {
      return escapar(l.nome) +
        (l.sem_preco_balcao ? '<br><span class="etiqueta atencao">Sem preço de balcão — usando o à vista</span>' : '') +
        (l.falta > 0 ? `<br><span class="etiqueta critica">Tem ${l.estoque_atual} em estoque</span>` : '');
    }

    function adicionar(produto_id, nome) {
      const existente = itens.find(i => i.produto_id === produto_id);
      if (existente) existente.quantidade += 1;
      else itens.push({ produto_id, nome, quantidade: 1 });
      recalcular();
    }

    function remover(produto_id) {
      itens = itens.filter(i => i.produto_id !== produto_id);
      recalcular();
    }

    // Guarda a venda em montagem, para ela sobreviver à troca de tela.
    function guardarRascunho() {
      if (restaurando) return;
      const cliente = document.getElementById('cliente').value;
      if (itens.length === 0 && !cliente.trim()) { rascunho.limpar(); return; }
      rascunho.salvar({ itens, cliente, meioPagamento });
    }

    async function recalcular() {
      guardarRascunho();

      if (itens.length === 0) {
        itensEl.innerHTML = '<tr><td colspan="5" class="vazio">Comece digitando o nome da peça acima.</td></tr>';
        totalEl.textContent = real(0);
        avisoBalcaoEl.style.display = 'none';
        avisoEstoqueEl.style.display = 'none';
        ultimoCalculo = null;
        mostrarPix();
        return;
      }

      // Guarda de ordem: com o recálculo sendo assíncrono, uma resposta antiga
      // pode chegar depois de uma nova e escrever número velho na tela.
      const meuPedido = ++sequenciaCalculo;
      const r = await window.erpAPI.pedidos.calcular(
        itens.map(({ produto_id, quantidade }) => ({ produto_id, quantidade })),
        'balcao'
      );
      if (meuPedido !== sequenciaCalculo) return;
      ultimoCalculo = r;

      TelaPedido.pintarItens(itensEl, r.linhas, {
        vazio: '<tr><td colspan="5" class="vazio">Comece digitando o nome da peça acima.</td></tr>',
        montarLinha: l => `
          <tr data-linha="${l.produto_id}">
            <td data-c="nome">${celulaNome(l)}</td>
            <td class="num"><input type="number" class="qtd" min="1" value="${l.quantidade}" data-id="${l.produto_id}"></td>
            <td class="num" data-c="unitario">${real(l.preco_unitario)}</td>
            <td class="num" data-c="subtotal" style="font-weight:700;">${real(l.subtotal)}</td>
            <td><button class="perigo mini" data-remover="${l.produto_id}">Tirar</button></td>
          </tr>`,
        celulas: l => ({
          nome: celulaNome(l),
          unitario: real(l.preco_unitario),
          subtotal: real(l.subtotal)
        })
      });

      totalEl.textContent = real(r.total);
      mostrarPix();

      if (r.semPrecoBalcao && r.semPrecoBalcao.length > 0) {
        avisoBalcaoEl.innerHTML = `
          <div class="titulo">Peça sem preço de balcão</div>
          <ul>${r.semPrecoBalcao.map(n => `<li>${escapar(n)}</li>`).join('')}</ul>
          <div style="color:var(--aco-500); font-size:0.81rem; margin-top:0.3rem;">
            Está usando o preço à vista do atacado. Cadastre o valor de balcão em Produtos.
          </div>`;
        avisoBalcaoEl.style.display = 'block';
      } else {
        avisoBalcaoEl.style.display = 'none';
      }

      if (r.semEstoque && r.semEstoque.length > 0) {
        avisoEstoqueEl.innerHTML = `
          <div class="titulo">Estoque não fecha</div>
          <ul>${r.semEstoque.map(s => `<li>${escapar(s.nome)} — pedido ${s.pedido}, tem ${s.tem}</li>`).join('')}</ul>`;
        avisoEstoqueEl.style.display = 'block';
      } else {
        avisoEstoqueEl.style.display = 'none';
      }
    }

    function alterarQuantidade(produto_id, quantidade) {
      const item = itens.find(i => i.produto_id === produto_id);
      if (item) { item.quantidade = Math.max(1, quantidade); recalcular(); }
    }

    // Quantidade digitada: atualiza enquanto escreve, com uma pausa curta para
    // não recalcular a cada tecla. Campo vazio no meio da digitação é ignorado —
    // virar 1 na marra atrapalha quem está apagando para trocar o número.
    let tQtd;
    itensEl.addEventListener('input', (e) => {
      if (!e.target.classList.contains('qtd')) return;
      const id = Number(e.target.dataset.id);
      const escrito = e.target.value;
      if (escrito === '') return;
      clearTimeout(tQtd);
      tQtd = setTimeout(() => alterarQuantidade(id, Number(escrito)), 250);
    });

    // Ao sair do campo (ou usar as setinhas), arruma o que ficou inválido.
    itensEl.addEventListener('change', (e) => {
      if (!e.target.classList.contains('qtd')) return;
      clearTimeout(tQtd);
      const quantidade = Math.max(1, Math.floor(Number(e.target.value) || 1));
      e.target.value = quantidade;
      alterarQuantidade(Number(e.target.dataset.id), quantidade);
    });

    itensEl.addEventListener('click', (e) => {
      const botao = e.target.closest('button[data-remover]');
      if (botao) remover(Number(botao.dataset.remover));
    });

    // ---------- O QR do pix, com o total dentro ----------
    //
    // Aparece no meio "Dinheiro / Pix", que é onde o pix mora hoje nesta
    // tela. QR sem valor faria o cliente digitar, e é digitando que sai
    // menos do que a conta.
    let pixPedido = 0;
    async function mostrarPix() {
      const alvo = document.getElementById('bloco-pix-venda');
      if (!alvo) return;

      const total = ultimoCalculo && ultimoCalculo.total;
      if (meioPagamento !== 'dinheiro' || !total) { alvo.innerHTML = ''; return; }

      // O total muda a cada item, e as respostas voltam fora de ordem.
      const meu = ++pixPedido;
      let p = null;
      try {
        p = await window.erpAPI.pagamento.pix(total);
      } catch (erro) {
        p = null;
      }
      if (meu !== pixPedido || meioPagamento !== 'dinheiro') return;
      if (!p) { alvo.innerHTML = ''; return; }

      alvo.innerHTML = `
        <div style="display:flex; gap:0.9rem; align-items:flex-start;">
          <div class="qr-pix" style="width:132px;">${p.qrGrande}</div>
          <div class="pix-ao-lado" style="font-size:0.85rem; line-height:1.55;">
            <div><strong>${escapar(p.nome)}</strong></div>
            <div style="color:var(--aco-500);">${escapar(p.tipoDaChave)} — ${escapar(p.chave)}</div>
            <div style="margin-top:0.3rem;">Cobrando <strong>${real(total)}</strong>,
              já dentro do código.</div>
          </div>
        </div>`;
    }

    // ---------- Meio de pagamento ----------
    document.querySelectorAll('.meio-pagamento button').forEach(botao => {
      botao.addEventListener('click', () => {
        document.querySelectorAll('.meio-pagamento button').forEach(b => b.classList.remove('escolhido'));
        botao.classList.add('escolhido');
        meioPagamento = botao.dataset.meio;
        guardarRascunho();
        mostrarPix();
      });
    });

    document.getElementById('cliente').addEventListener('input', guardarRascunho);

    // ---------- Finalizar ----------
    function limpar() {
      itens = [];
      cacheProdutos = null;
      document.getElementById('cliente').value = '';
      rascunho.limpar();
      recalcular();
      buscaEl.focus();
    }

    // Trava contra clique duplo.
    //
    // Sem ela, dois cliques rápidos em "Finalizar" gravavam a venda DUAS
    // VEZES — dois pedidos, estoque baixado duas vezes — porque o `await`
    // do salvar demora e nada impedia a segunda entrada. Travar só o botão
    // não bastava: o teclado também dispara. A trava fica aqui, no caminho
    // por onde todos passam.
    let finalizando = false;

    async function finalizar() {
      if (finalizando) return;
      if (!ultimoCalculo || itens.length === 0) {
        avisar('Adicione pelo menos uma peça.', 'atencao');
        return;
      }

      finalizando = true;
      travarBotoes(true);
      try {
        // O que a caixinha vai mostrar tem de ser guardado ANTES de limpar
        // o balcão: `limpar` zera o cálculo, e aí não há mais total nenhum.
        const total = ultimoCalculo.total;
        const pecas = ultimoCalculo.linhas.length;
        const unidades = ultimoCalculo.linhas.reduce((s, l) => s + l.quantidade, 0);

        const id = await window.erpAPI.pedidos.salvar({
          cliente: document.getElementById('cliente').value.trim(),
          cliente_id: null,
          formaPagamento: 'balcao',
          meioPagamento,
          linhas: ultimoCalculo.linhas,
          total
        });

        // A venda está gravada: o balcão fica pronto para a próxima ANTES
        // de a caixinha abrir. Quem fechar a caixinha não encontra sobra da
        // venda anterior no carrinho.
        limpar();

        abrirCaixaDaVenda({ id, total, pecas, unidades, meio: meioPagamento });
      } catch (erro) {
        // Falha no SALVAR, que é diferente de falha na impressão: aqui não
        // há venda nenhuma, e o carrinho não pode ser limpo.
        avisar(`Não deu para registrar a venda: ${motivo(erro)}`, 'erro');
      } finally {
        finalizando = false;
        travarBotoes(false);
      }
    }

    function travarBotoes(travado) {
      for (const id of ['btn-finalizar', 'btn-limpar']) {
        const b = document.getElementById(id);
        if (b) b.disabled = travado;
      }
    }

    document.getElementById('btn-finalizar').addEventListener('click', () => finalizar());
    document.getElementById('btn-limpar').addEventListener('click', limpar);

    // ---------- A caixinha depois da venda ----------
    //
    // Ela existe para o balcão parar de imprimir sozinho. O diálogo do
    // Windows abrindo sem aviso, no meio do atendimento, é o tipo de coisa
    // que faz a pessoa clicar em qualquer lugar para se livrar dele.
    let vendaNaCaixa = null;

    const MEIOS = { dinheiro: 'Dinheiro / Pix', cartao: 'Cartão' };

    function abrirCaixaDaVenda(venda) {
      vendaNaCaixa = venda;

      document.getElementById('venda-numero').textContent = `Venda #${venda.id}`;

      const linha = (rotulo, valor, classe = '') =>
        `<div class="${classe}"><span class="r">${escapar(rotulo)}</span>` +
        `<span class="v">${escapar(valor)}</span></div>`;

      // Quantas peças diferentes e quantas unidades ao todo. Só diz as
      // unidades quando o número é outro: "3 peças · 3 unidades" é ruído.
      const contagem = venda.unidades > venda.pecas
        ? `${venda.pecas} ${venda.pecas === 1 ? 'peça' : 'peças'} · ${venda.unidades} un`
        : `${venda.pecas} ${venda.pecas === 1 ? 'peça' : 'peças'}`;

      document.getElementById('venda-resumo').innerHTML = [
        linha('Itens', contagem),
        linha('Total', real(venda.total), 'destaque'),
        linha('Pagamento', MEIOS[venda.meio] || venda.meio)
      ].join('');

      recado('');
      document.getElementById('cobertura-venda').classList.add('aberta');
      document.getElementById('caixa-venda').classList.add('aberta');
      // O foco vai para Imprimir: é o botão que quase sempre se usa, e
      // assim Enter já resolve sem tirar a mão do teclado.
      document.getElementById('btn-imprimir-venda').focus();
    }

    function recado(texto, tipo = 'erro') {
      const el = document.getElementById('venda-recado');
      el.textContent = texto;
      el.className = `recado ${tipo}`;
      el.style.display = texto ? 'block' : 'none';
    }

    function fecharCaixaDaVenda() {
      vendaNaCaixa = null;
      document.getElementById('cobertura-venda').classList.remove('aberta');
      document.getElementById('caixa-venda').classList.remove('aberta');
      // De volta para a busca: o balcão fica pronto para a próxima venda
      // sem ninguém precisar clicar no campo.
      buscaEl.focus();
    }

    document.getElementById('btn-fechar-venda').addEventListener('click', fecharCaixaDaVenda);
    document.getElementById('cobertura-venda').addEventListener('click', fecharCaixaDaVenda);

    // Enquanto o papel está saindo, os dois botões travam: mandar o mesmo
    // cupom duas vezes é papel jogado fora e confunde quem confere depois.
    function travarSaidas(travado) {
      for (const id of ['btn-imprimir-venda', 'btn-pdf-venda']) {
        document.getElementById(id).disabled = travado;
      }
    }

    document.getElementById('btn-imprimir-venda').addEventListener('click', async () => {
      if (!vendaNaCaixa) return;
      const botao = document.getElementById('btn-imprimir-venda');
      const rotulo = botao.textContent;
      travarSaidas(true);
      botao.textContent = 'Imprimindo...';
      recado('');
      try {
        const r = await window.erpAPI.impressao.imprimir(vendaNaCaixa.id);
        if (r && r.impresso) {
          // Imprimiu: a caixinha já cumpriu o papel e sai da frente.
          fecharCaixaDaVenda();
        } else if (r && r.motivo === 'cancelled') {
          recado('Impressão cancelada. A venda continua registrada.', 'atencao');
        } else {
          recado('A impressora não confirmou a impressão. A venda continua registrada.', 'atencao');
        }
      } catch (erro) {
        // A venda está gravada de qualquer jeito. Falha de impressora não
        // desfaz nada, e a caixinha continua aberta para tentar de novo.
        recado(`Venda #${vendaNaCaixa.id} registrada, mas o cupom não saiu: ${motivo(erro)}`);
      }
      travarSaidas(false);
      botao.textContent = rotulo;
    });

    document.getElementById('btn-pdf-venda').addEventListener('click', async () => {
      if (!vendaNaCaixa) return;
      const botao = document.getElementById('btn-pdf-venda');
      const rotulo = botao.textContent;
      travarSaidas(true);
      botao.textContent = 'Gerando...';
      recado('');
      try {
        await window.erpAPI.pedidos.salvarPDF(vendaNaCaixa.id, { abrirDepois: true });
        fecharCaixaDaVenda();
      } catch (erro) {
        recado(`Venda #${vendaNaCaixa.id} registrada, mas o PDF não saiu: ${motivo(erro)}`);
      }
      travarSaidas(false);
      botao.textContent = rotulo;
    });

    // Na captura, e não na subida: a cobertura barra o mouse, mas o Tab
    // ainda alcança os botões de trás. Pegando a tecla antes de ela chegar
    // ao que estiver com o foco, um Enter não aciona a caixinha E o botão
    // escondido atrás dela ao mesmo tempo.
    document.addEventListener('keydown', (e) => {
      if (!vendaNaCaixa) return;
      if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        fecharCaixaDaVenda();
      }
      if (e.key === 'Enter') {
        e.preventDefault(); e.stopPropagation();
        document.getElementById('btn-imprimir-venda').click();
      }
    }, true);

    // ---------- Abertura da tela ----------
    function iniciar() {
      const guardado = rascunho.ler();
      if (guardado && (guardado.itens || []).length > 0) {
        restaurando = true;
        itens = guardado.itens;
        document.getElementById('cliente').value = guardado.cliente || '';
        meioPagamento = guardado.meioPagamento || 'dinheiro';
        document.querySelectorAll('.meio-pagamento button').forEach(b => {
          b.classList.toggle('escolhido', b.dataset.meio === meioPagamento);
        });
        restaurando = false;
        TelaPedido.avisarRascunho(
          'Voltamos a venda que você estava montando.',
          () => { rascunho.limpar(); location.reload(); }
        );
      }
      recalcular();
      buscaEl.focus();
    }

    iniciar();
  </script>
</body>
</html>
