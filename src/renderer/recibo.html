<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recibo</title>
  <style>
    /* LARGURA ÚTIL DE IMPRESSÃO — não é a largura do papel.
       Papel de 80mm imprime ~72mm; papel de 58mm imprime ~48mm.
       Isso vem da tela de Configurações; o valor aqui é só o de segurança
       para o caso de a configuração não chegar. */
    :root { --largura-papel: 72mm; }

    @page { margin: 0; }

    /* Sem isto, o recuo de 2mm de cada lado somava na largura e o corpo
       saía com 76mm em vez de 72mm — o que corta o cupom na direita. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 3mm 2mm;
      width: var(--largura-papel);
      font-family: "Courier New", monospace;
      font-size: 11px;
      line-height: 1.35;
      color: #000;
      background: #fff;
    }

    .centro { text-align: center; }

    .logo-cupom {
      width: 38mm;
      max-width: 90%;
      height: auto;
      margin-bottom: 2mm;
      /* Aumenta o contraste: impressora térmica só imprime preto ou nada */
      filter: grayscale(100%) contrast(180%);
    }
    .negrito { font-weight: bold; }
    .loja { font-size: 15px; font-weight: bold; }
    .sub { font-size: 10px; }

    hr {
      border: none;
      border-top: 1px dashed #000;
      margin: 6px 0;
    }

    table { width: 100%; border-collapse: collapse; }
    td { vertical-align: top; padding: 1px 0; }
    td.num { text-align: right; white-space: nowrap; padding-left: 4px; }

    .item-nome { font-size: 10.5px; }
    .detalhe { font-size: 10px; color: #000; }

    .total-linha {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      margin-top: 4px;
    }

    .aviso {
      font-size: 9.5px;
      text-align: center;
      margin-top: 6px;
    }

    .rodape {
      text-align: center;
      font-size: 9.5px;
      margin-top: 8px;
    }
  
    /* ---------- PIX ----------
       O QR precisa cair em numero INTEIRO de pontos da impressora: a
       termica tem 8 pontos por milimetro, e modulo em fracao de ponto sai
       borrado — borrado o leitor nao pega. A largura vem calculada de
       fora, ja arredondada. */
    .pix { text-align: center; }
    .risco-pix { border-top: 1px dashed #000; margin: 6px 0; }
    .pix-titulo { font-weight: bold; font-size: 12px; margin-bottom: 3px; }
    /* O `auto` nas laterais é o que centraliza: o elemento tem largura
       fixa em milímetros, e nesse caso o text-align do pai não o move. */
    .pix-codigo { line-height: 0; margin: 3px auto 4px; }
    .pix-codigo svg {
      width: 100%; height: auto; display: block; margin: 0 auto;
      image-rendering: pixelated;
    }
    .pix-nome { font-weight: bold; font-size: 11px; }
    .pix-linha { font-size: 10px; }
    .pix-chave { font-family: 'Consolas', monospace; font-size: 10px; }
</style>
</head>
<body>
  <!-- Logo no cupom.
       Impressora térmica imprime imagem com pouca definição e gasta mais papel.
       Se sair borrada ou muito escura, apague as 2 linhas abaixo — o nome em
       texto continua aparecendo normalmente. -->
  <div class="centro"><img src="logo-recibo.png" class="logo-cupom" alt=""></div>

  <div class="centro loja">V.T. BICICLETAS</div>
  <div class="centro sub">O seu fornecedor completo de peças</div>
  <div class="centro sub">Tel: (21) 98332-0678</div>
  <div class="centro sub">R. Antônio Pacheco, 40 - Carmari</div>
  <div class="centro sub">Nova Iguaçu / RJ</div>

  <hr>

  <div id="cabecalho"></div>
  <div id="parcelas"></div>

  <hr>

  <table id="itens"></table>

  <hr>

  <div class="total-linha">
    <span>TOTAL</span>
    <span id="total"></span>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="pix" id="pix" style="display:none;">
    <div class="risco-pix"></div>
    <div class="pix-titulo">PAGUE COM PIX</div>
    <div class="pix-codigo" id="pix-codigo"></div>
    <div class="pix-nome" id="pix-nome"></div>
    <div class="pix-linha" id="pix-instituicao"></div>
    <div class="pix-chave" id="pix-chave"></div>
    <div class="pix-linha" id="pix-recado"></div>
    <div class="risco-pix"></div>
  </div>

  <div class="rodape">
    Obrigado pela preferência!<br>
    Este documento não é fiscal.
  </div>

  <script>
    function formatarReal(v) {
      return (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    const nomesForma = {
      balcao: 'Balcao (varejo)',
      prazo: 'A prazo',
      vista: 'À vista',
      vista_retirada: 'À vista c/ retirada em loja'
    };

    // O processo principal envia os dados do pedido por aqui.
    window.erpAPI.aoReceberRecibo((pedido, opcoes) => {
      // Largura útil de impressão, vinda da tela de Configurações.
      if (opcoes && opcoes.larguraMM > 0) {
        document.documentElement.style.setProperty('--largura-papel', `${opcoes.larguraMM}mm`);
      }

      // --- PIX ---
      // A largura do QR e calculada para bater com os pontos da impressora:
      // 6 pontos por modulo, 8 pontos por milimetro.
      const pg = opcoes && opcoes.pagamento;
      if (pg) {
        const larguraQR = (pg.modulosComMargem * 6) / 8;
        document.getElementById('pix-codigo').style.width = larguraQR.toFixed(2) + 'mm';
        document.getElementById('pix-codigo').innerHTML = pg.qrPequeno;
        document.getElementById('pix-nome').textContent = pg.nome;
        document.getElementById('pix-instituicao').textContent = pg.instituicao || '';
        document.getElementById('pix-chave').textContent = pg.chave;
        document.getElementById('pix-recado').textContent = pg.recado || '';
        document.getElementById('pix').style.display = 'block';
      }

      const data = new Date(pedido.criado_em || Date.now());
      const dataTexto = data.toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      document.getElementById('cabecalho').innerHTML = `
        <div><span class="negrito">Pedido:</span> #${pedido.id ?? '-'}</div>
        <div><span class="negrito">Data:</span> ${dataTexto}</div>
        ${pedido.cliente ? `<div><span class="negrito">Cliente:</span> ${pedido.cliente}</div>` : ''}
        <div><span class="negrito">Pagamento:</span> ${nomesForma[pedido.forma_pagamento] || pedido.forma_pagamento}</div>
      `;

      // Parcelas do pedido a prazo, com data e valor de cada uma
      const parcelas = pedido.parcelas || [];
      if (parcelas.length > 0) {
        const dia = v => v ? v.slice(0, 10).split('-').reverse().join('/') : 'a combinar';
        document.getElementById('parcelas').innerHTML = `
          <div style="border-top:1px dashed #333; margin:7px 0;"></div>
          <div class="negrito" style="margin-bottom:2px;">
            ${parcelas.length === 1 ? 'Pagamento' : 'Pagamento em ' + parcelas.length + 'x'}
          </div>
          ${parcelas.map(p => `
            <div style="display:flex; justify-content:space-between;">
              <span>${p.total_parcelas > 1 ? p.parcela + '/' + p.total_parcelas + ' - ' : ''}${dia(p.vencimento)}</span>
              <span>${formatarReal(p.valor)}</span>
            </div>`).join('')}
        `;
      }

      document.getElementById('itens').innerHTML = pedido.itens.map(i => `
        <tr>
          <td colspan="2" class="item-nome">${i.nome}</td>
        </tr>
        <tr>
          <td class="detalhe">${i.quantidade} x ${formatarReal(i.preco_unitario)}</td>
          <td class="num">${formatarReal(i.subtotal)}</td>
        </tr>
      `).join('');

      document.getElementById('total').textContent = formatarReal(pedido.total);

      // A regra dos R$ 2.000 vale só para pagamento à vista.
      if (pedido.total >= 2000 && pedido.forma_pagamento === 'vista') {
        document.getElementById('aviso').textContent =
          '* Preço de retirada aplicado - entrega grátis em compras acima de R$ 2.000,00';
      }

      // Avisa o processo principal que o recibo está pronto para imprimir.
      window.erpAPI.reciboPronto();
    });
  </script>
</body>
</html>
