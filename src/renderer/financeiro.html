<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A receber — VT Bicicletas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <script src="menu.js"></script>

  <main class="conteudo">
    <h1 class="titulo-pagina">A receber</h1>
    <p class="subtitulo-pagina">Todo pedido a prazo entra aqui. Marque como pago quando o dinheiro chegar.</p>

    <div class="grade-4" style="margin-bottom: 1.1rem;">
      <div class="indicador destaque">
        <div class="rotulo">Em aberto</div>
        <div class="valor" id="i-aberto">—</div>
        <div class="nota" id="i-aberto-qtd"></div>
      </div>
      <div class="indicador alerta">
        <div class="rotulo">Vencido</div>
        <div class="valor" id="i-vencido">—</div>
        <div class="nota" id="i-vencido-qtd"></div>
      </div>
      <div class="indicador">
        <div class="rotulo">Vence em 7 dias</div>
        <div class="valor" id="i-proximos">—</div>
      </div>
      <div class="indicador positivo">
        <div class="rotulo">Recebido no mês</div>
        <div class="valor" id="i-mes">—</div>
      </div>
    </div>

    <div class="abas">
      <button class="aba ativa" data-situacao="abertas">Em aberto</button>
      <button class="aba" data-situacao="vencidas">Vencidas</button>
      <button class="aba" data-situacao="pagas">Pagas</button>
      <button class="aba" data-situacao="todas">Todas</button>
    </div>

    <div class="cartao">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Pedido</th>
            <th>Vencimento</th>
            <th class="num">Valor</th>
            <th>Situação</th>
            <th style="width: 1%;"></th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
  </main>

  <script>
    const listaEl = document.getElementById('lista');
    let situacaoAtual = 'abertas';

    const real = v => (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const escapar = t => String(t ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    const hojeISO = () => new Date().toISOString().slice(0, 10);

    function formatarDia(iso) {
      if (!iso) return '—';
      const [a, m, d] = iso.slice(0, 10).split('-');
      return `${d}/${m}/${a}`;
    }

    function diasAte(iso) {
      const hoje = new Date(hojeISO());
      const alvo = new Date(iso);
      return Math.round((alvo - hoje) / 86400000);
    }

    function etiquetaSituacao(c) {
      if (c.pago) return '<span class="etiqueta ok">Pago</span>';
      if (!c.vencimento) return '<span class="etiqueta neutra">Sem prazo</span>';
      const dias = diasAte(c.vencimento);
      if (dias < 0) return `<span class="etiqueta critica">Vencida há ${Math.abs(dias)} d</span>`;
      if (dias === 0) return '<span class="etiqueta atencao">Vence hoje</span>';
      if (dias <= 7) return `<span class="etiqueta atencao">Vence em ${dias} d</span>`;
      return `<span class="etiqueta neutra">Em ${dias} d</span>`;
    }

    async function atualizarIndicadores() {
      const r = await window.erpAPI.financeiro.resumo();
      document.getElementById('i-aberto').textContent = real(r.aberto_valor);
      document.getElementById('i-aberto-qtd').textContent =
        r.aberto_qtd === 1 ? '1 conta' : `${r.aberto_qtd} contas`;
      document.getElementById('i-vencido').textContent = real(r.vencido_valor);
      document.getElementById('i-vencido-qtd').textContent =
        r.vencido_qtd === 1 ? '1 conta' : `${r.vencido_qtd} contas`;
      document.getElementById('i-proximos').textContent = real(r.proximos_7_dias);
      document.getElementById('i-mes').textContent = real(r.recebido_mes);
    }

    async function carregarLista() {
      const contas = await window.erpAPI.financeiro.listar(situacaoAtual);

      const mensagens = {
        abertas: 'Nada em aberto. Ninguém está devendo.',
        vencidas: 'Nenhuma conta vencida.',
        pagas: 'Nenhuma conta paga ainda.',
        todas: 'Nenhuma conta registrada. Pedidos a prazo aparecem aqui automaticamente.'
      };

      if (contas.length === 0) {
        listaEl.innerHTML = `<tr><td colspan="6" class="vazio">${mensagens[situacaoAtual]}</td></tr>`;
        return;
      }

      listaEl.innerHTML = contas.map(c => `
        <tr data-id="${c.id}">
          <td>${escapar(c.cliente_nome) || '<span style="color:var(--aco-500)">Sem cliente</span>'}</td>
          <td>
            ${c.pedido_id ? '#' + c.pedido_id : '—'}
            ${c.total_parcelas > 1
              ? `<span class="etiqueta neutra" style="margin-left:0.25rem;">${c.parcela}/${c.total_parcelas}</span>`
              : ''}
          </td>
          <td>
            <input type="date" class="venc" data-id="${c.id}"
                   value="${c.vencimento ? c.vencimento.slice(0, 10) : ''}"
                   style="padding:0.25rem 0.35rem; font-size:0.82rem; width:135px;">
          </td>
          <td class="num" style="font-weight:700;">${real(c.valor)}</td>
          <td>${etiquetaSituacao(c)}</td>
          <td>
            <div class="acoes-esq">
              ${c.pago
                ? `<button class="neutro mini" data-acao="reabrir" data-id="${c.id}">Reabrir</button>`
                : `<button class="mini" data-acao="baixar" data-id="${c.id}">Marcar pago</button>`}
              <button class="perigo mini" data-acao="excluir" data-id="${c.id}">Excluir</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function recarregar() {
      await carregarLista();
      await atualizarIndicadores();
    }

    listaEl.addEventListener('click', async (e) => {
      const botao = e.target.closest('button[data-acao]');
      if (!botao) return;
      const id = Number(botao.dataset.id);

      if (botao.dataset.acao === 'baixar') await window.erpAPI.financeiro.darBaixa(id);
      if (botao.dataset.acao === 'reabrir') await window.erpAPI.financeiro.reabrir(id);
      if (botao.dataset.acao === 'excluir') {
        if (!confirm('Excluir esta conta a receber? O pedido continua no histórico.')) return;
        await window.erpAPI.financeiro.excluir(id);
      }
      recarregar();
    });

    listaEl.addEventListener('change', async (e) => {
      if (!e.target.classList.contains('venc')) return;
      await window.erpAPI.financeiro.alterarVencimento(Number(e.target.dataset.id), e.target.value);
      recarregar();
    });

    document.querySelectorAll('.aba').forEach(aba => {
      aba.addEventListener('click', () => {
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        aba.classList.add('ativa');
        situacaoAtual = aba.dataset.situacao;
        carregarLista();
      });
    });

    recarregar();
  </script>
</body>
</html>
